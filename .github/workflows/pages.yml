name: Deploy public demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Configure optional AI endpoint
        env:
          JARVIS_API_URL: ${{ vars.JARVIS_API_URL }}
        run: |
          if [ -n "$JARVIS_API_URL" ]; then
            python - <<'PY'
          import os
          from pathlib import Path
          path = Path("demo/index.html")
          html = path.read_text()
          html = html.replace("https://YOUR-WORKER-NAME.YOUR-SUBDOMAIN.workers.dev", os.environ["JARVIS_API_URL"].rstrip("/"))
          path.write_text(html)
          PY
          fi
      - name: Upload demo artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
